<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name - Digital Business Card</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --button-bg: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid var(--accent);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .title {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .save-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .save-btn:hover {
      background-color: var(--accent-hover);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background-color: var(--button-bg);
      color: var(--text);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .link-item:hover {
      background-color: #475569;
      transform: translateY(-1px);
    }

    footer {
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Replace image URL with your headshot URL or local file path -->
    <img class="avatar" src="Headshot.jpg" alt="Profile Headshot" id="headshot">
    
    <h1 id="fullName">Russell Wrightson</h1>
    <p class="title" id="jobTitle">Non-Profit Board Member</p>
    <p class="bio" id="bio">President VaHomeschoolers, President FaHa, Board Member at large Nurturings</p>

    <!-- Save to Contacts Button -->
    <button class="save-btn" onclick="downloadVCard()">Add to Contacts</button>

    <!-- Social & Contact Links -->
    <div class="links">
      <a class="link-item" href="mailto:Russwrightson@gmail.com">📧 Russwrightson@gmail.com</a>
      <a class="link-item" href="https://form.jotform.com/russellwrightson/homeschool-graduate-transcript">VaHomeschoolers Transcript Services</a>
      <a class="link-item" href="https://www.zeffy.com/en-US/ticketing/adaptive-toys"> Adaptive Toys Projects </a>
      <a class="link-item" href="tel:+5406040129">📞 Call Me</a>
    </div>

    <footer>
      <p>© <span id="year"></span> Russell Wrightson</p>
    </footer>
  </div>

  <script>
    // --- EDIT YOUR CONTACT DETAILS HERE FOR THE "ADD TO CONTACTS" BUTTON ---
    const contactInfo = {
      firstName: "Russell",
      lastName: "Wrightson",
      org: "Homeschool, Parenting",
      title: "President FaHa",
      phone: "+11234567890",
      email: "Russwrightson@gmail.com",
      url: "https://fahahome.com"
    };

    document.getElementById('year').textContent = new Date().getFullYear();

    // Generates and triggers download of the .vcf contact card file
    function downloadVCard() {
      const vcardData = 
`BEGIN:VCARD
VERSION:3.0
N:${contactInfo.lastName};${contactInfo.firstName};;;
FN:${contactInfo.firstName} ${contactInfo.lastName}
ORG:${contactInfo.org}
TITLE:${contactInfo.title}
TEL;TYPE=CELL:${contactInfo.phone}
EMAIL:${contactInfo.email}
URL:${contactInfo.url}
END:VCARD`;

      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', `${contactInfo.firstName}_${contactInfo.lastName}.vcf`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
